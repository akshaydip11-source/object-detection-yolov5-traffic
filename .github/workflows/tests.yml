name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install 'torch>=2.6,<3' 'torchvision>=0.21,<1' --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: ruff check backend api inference training scripts tests server.py --select F
      - run: python -m pytest -q
      - run: python scripts/check_frontend.py
      - run: docker build -t safecity-ci .
      - run: python scripts/setup_env.py
      - run: docker compose config --quiet
      - run: python -m tests.container_smoke
      - run: python -m playwright install --with-deps chromium
      - run: RUN_BROWSER_TESTS=1 python -m pytest tests/test_browser.py -q
