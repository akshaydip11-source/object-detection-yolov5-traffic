name: Public dataset pilot
on:
  push:
    branches: [arena/01a0cfd1-object-detection-yolov5-traffi]
    paths:
      - .github/workflows/public-dataset.yml
      - training/public_dataset.py
      - training/public_pilot.py
permissions:
  contents: read
concurrency:
  group: public-dataset-pilot
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YOLOv5_AUTOINSTALL: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      WANDB_MODE: disabled
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install 'torch==2.6.0' 'torchvision==0.21.0' --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: pip check && python -m pytest tests/test_public_dataset.py tests/test_dataset.py -q
      - name: Download pinned public export and validate labels, license and splits
        run: python -m training.public_dataset --output runs/public-pilot-data
      - name: Train experimental YOLOv5n and evaluate held-out validation and test data
        run: python -m training.public_pilot
      - name: Keep reproducible audit and experimental results (never install automatically)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-dataset-pilot
          retention-days: 14
          if-no-files-found: warn
          path: |
            runs/public-pilot-data/provenance.json
            runs/public-pilot-data/ATTRIBUTION.md
            runs/public-pilot-results/
            runs/public-pilot-evaluation/
            runs/train/**/results.csv
            runs/train/**/training_report.json
            runs/train/**/hyp.yaml
            runs/train/**/opt.yaml
